<script type="module">
    var suggestions = document.getElementById('suggestions');
    var search = document.getElementById('flexsearch');

    const flexsearchContainer = document.getElementById('FlexSearchCollapse');

    const hideFlexsearchBtn = document.getElementById('hideFlexsearch');

    const configObject = { toggle: false }
    const flexsearchContainerCollapse = new Collapse(flexsearchContainer, configObject) // initialized with no keyboard

    if (search !== null) {
        document.addEventListener('keydown', inputFocus);
        flexsearchContainer.addEventListener('shown.bs.collapse', function () {
            search.focus();
        });
        // hide search collapse containder by clicking outside (except top header)
        var topHeader = document.getElementById("top-header");
        document.addEventListener('click', function(elem) {
            if (!flexsearchContainer.contains(elem.target) && !topHeader.contains(elem.target))
                flexsearchContainerCollapse.hide();
        });
    }

    hideFlexsearchBtn.addEventListener('click', () =>{
        console.log("hide button clicked")
        flexsearchContainerCollapse.hide()
    })

    function inputFocus(e) {
        if ((e.ctrlKey && e.key === '/') || (e.metaKey && e.key === '/')) {
            e.preventDefault();
            flexsearchContainerCollapse.toggle();
        }
        if (e.key === 'Escape' ) {
            search.blur();
            // suggestions.classList.add('d-none');
            flexsearchContainerCollapse.hide();
        }
    };

    document.addEventListener('click', function(event) {

    var isClickInsideElement = suggestions.contains(event.target);

    if (!isClickInsideElement) {
        suggestions.classList.add('d-none');
    }

    });


    /*
    Source:
    - https://dev.to/shubhamprakash/trap-focus-using-javascript-6a3
    */

    document.addEventListener('keydown',suggestionFocus);

    function suggestionFocus(e) {
    const suggestionsHidden = suggestions.classList.contains('d-none');
    if (suggestionsHidden) return;

    const focusableSuggestions= [...suggestions.querySelectorAll('a')];
    if (focusableSuggestions.length === 0) return;

    const index = focusableSuggestions.indexOf(document.activeElement);

    if (e.key === "ArrowUp") {
        e.preventDefault();
        const nextIndex = index > 0 ? index - 1 : 0;
        focusableSuggestions[nextIndex].focus();
    }
    else if (e.key === "ArrowDown") {
        e.preventDefault();
        const nextIndex= index + 1 < focusableSuggestions.length ? index + 1 : index;
        focusableSuggestions[nextIndex].focus();
    }

    }

    let index = [];
    {{ $list := slice }}
    {{- $list = .Site.Pages }}
    {{ $len := (len $list) -}}

    {{ range $index, $element := $list -}}
        {{- if or (eq $element.Params.layout "song-view") (eq $element.Params.layout "album-view") }}
            {{ $artist := "" }}
            {{- if eq .Parent.Params.layout "artist-view"}}
                {{- if .Parent.Params.subtitle }}
                    {{- $artist = printf "%s (%s)" .Parent.Title .Parent.Params.subtitle }}
                {{- else }}
                    {{- $artist = .Parent.Title }}
                {{- end -}}
            {{- else }}
                {{- if .Parent.Parent.Params.subtitle }}
                    {{- $artist = printf "%s (%s)" .Parent.Parent.Title .Parent.Parent.Params.subtitle }}
                {{- else }}
                    {{- $artist = .Parent.Parent.Title }}
                {{- end -}}
            {{- end -}}
            index.push(
                {
                    id: {{ $index }},
                    href: "{{ .RelPermalink }}",
                    {{- if $element.Params.subtitle }}
                    title: "{{ .Title }} ({{ $element.Params.subtitle }})",
                    {{- else }}
                    title: "{{ .Title }}",
                    {{- end }}
                    artist: "{{ $artist }}",
                }
            );
        {{- end }}
    {{ end -}}

    function show_results(query) {
        const maxResult = {{ .Site.Params.fuzzysort.maxResult | default 5}};

        const results = fuzzysort.go(query.data, index, { keys: ['title'], limit: 10 });
        const filteredResults = results.map(result => result.obj);

        console.log("Filtered Results: ", filteredResults);
        suggestions.innerHTML = "";
        suggestions.classList.remove('d-none');

        for (let res of filteredResults) {
            const entry = document.createElement('div');
            suggestions.appendChild(entry);

            const a = document.createElement('a');
            a.href = res.href;
            entry.appendChild(a);

            const title = document.createElement('span');
            title.textContent = res.title;
            title.classList.add("suggestion__title");
            a.appendChild(title);

            const description = document.createElement('span');
            description.textContent = res.artist;
            description.classList.add("suggestion__description");
            a.appendChild(description);

            suggestions.appendChild(entry);

            if(suggestions.childElementCount == maxResult) break;
        }
    }

    search.addEventListener('input', show_results, true);
</script>
